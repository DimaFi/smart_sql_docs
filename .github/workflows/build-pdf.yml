name: Build NIR PDF
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate bibliography
        run: python3 scripts/check_bibliography.py
      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: report
          latexmk_use_xelatex: true
          os: debian
          extra_system_packages: "fonts-croscore fonts-liberation fonts-dejavu-core"
          args: -pdfxe -interaction=nonstopmode -halt-on-error -file-line-error
      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: SmartSQL-NIR-Report
          path: report/main.pdf
          if-no-files-found: error